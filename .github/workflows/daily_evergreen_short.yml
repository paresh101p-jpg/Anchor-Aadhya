name: Anchor Aadhya Daily Evergreen Short (Faceless Inside-Out)

on:
  workflow_dispatch: # Allows manual 1-click run anytime from GitHub Actions tab
    inputs:
      engine:
        description: 'Visual engine (2d = Rick Clips / Inside-Out animated)'
        required: false
        default: '2d'
        type: string
      topic_id:
        description: 'Optional curiosity_topics.json id to render a specific topic'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Render frames only, do NOT upload to YouTube'
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [daily_short, post_aadhya_short]
  push:
    paths:
      - 'TRIGGER_AADHYA_POST.txt'
  schedule:
    # 02:30 UTC = 08:00 AM IST & 11:30 UTC = 05:00 PM IST
    - cron: '30 2 * * *'
    - cron: '30 11 * * *'

concurrency:
  group: aadhya-evergreen-short
  cancel-in-progress: false

jobs:
  render-and-upload-short:
    name: Render Faceless Inside-Out Short & Upload to YouTube
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 22 (Native WebSocket Support)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install System Dependencies (FFmpeg, Google Chrome & Hindi Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-extra fonts-noto-core fonts-deva
          if ! command -v google-chrome &> /dev/null && ! command -v google-chrome-stable &> /dev/null; then
            echo "Installing Google Chrome..."
            wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y ./google-chrome-stable_current_amd64.deb || true
          fi
          echo "Verified Chrome path: $(which google-chrome || which google-chrome-stable || which chromium || echo 'NOT_FOUND')"

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Render 2D Aadhya Short (Rick's Clips Inside-Out) & Post as Unlisted
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: unlisted
          DRY_RUN: ${{ inputs.dry_run }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
        run: |
          set -o pipefail
          TOPIC_ID="${{ github.event.inputs.topic_id || '' }}"
          export AADHYA_ENGINE="2d"
          export TOPIC_ID="$TOPIC_ID"
          echo "Starting 2D Rick's Clips Engine (topic=$TOPIC_ID)..."
          python -u generate_evergreen_short.py 2>&1 | tee run_debug.log

      - name: Commit Run Logs & Trackers
        if: always()
        run: |
          git config user.name "Anchor Aadhya Bot"
          git config user.email "bot@anchoraadhya.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update run debug log & tracker [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin master || { git rebase --abort || true; git pull --rebase origin master || true; }
            git push origin master && break || sleep 3
          done
