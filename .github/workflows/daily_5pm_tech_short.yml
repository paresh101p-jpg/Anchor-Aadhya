name: Daily 5:00 PM AI Tech Reel (Anchor Aadhya)

on:
  # schedule:
    # EXACTLY DAILY AT 5:00 PM IST:
    # 11:30 UTC = 05:00 PM IST (Prime Evening Peak)
    - cron: '30 11 * * *'
  repository_dispatch: # External precision trigger from cron-job.org
    types: [daily_shorts_trigger, daily_5pm_trigger, 5pm_reel, daily_reel, post_reel, create_short, trigger_short]
  workflow_dispatch: # Allows manual 1-click trigger from GitHub UI anytime
  push:
    paths:
      - 'TRIGGER_AADHYA_POST.txt'

concurrency:
  group: anchor-aadhya-daily-5pm
  cancel-in-progress: false

jobs:
  generate_and_upload_5pm_short:
    name: Generate & Upload 5:00 PM Tech Short
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg, Chromium & Fonts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg chromium-browser fonts-noto-core fonts-deva fonts-liberation

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts opencv-python-headless pillow numpy requests google-genai google-api-python-client google-auth-oauthlib google-auth

      - name: Generate Today's 4-5 Tech & AI Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python daily_5pm_tech_short_pipeline.py

      - name: Upload Tech Short to YouTube Channel (Anchor Aadhya)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python youtube_uploader.py --video Anchor_Aadhya_Daily_5PM_Short.mp4 --meta metadata_shorts.json

      - name: Commit & Push Anti-Duplication Archive & Tracker
        run: |
          git config --local user.email "bot@anchoraadhya.com"
          git config --local user.name "Anchor Aadhya Auto Bot"
          git add used_news_archive.json uploaded_bulletins_tracker.txt || true
          git commit -m "chore: record daily 5 PM tech reel and update archive [skip ci]" || echo "No changes to commit"
          for i in 1 2 3; do
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }} && break || sleep 3
          done
